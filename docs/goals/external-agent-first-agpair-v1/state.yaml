# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "External Agent First AGPair V1"
  slug: "external-agent-first-agpair-v1"
  kind: existing_plan
  tranche: "Execute the full external-agent-first AGPair V1 implementation plan through final regression and privacy gate."
  status: complete
  oracle:
    signal: "Task 14 verification from docs/superpowers/plans/2026-06-02-external-agent-first-agpair-v1.md passes, and final audit confirms external-first Codex/Claude behavior, low-token wait/watch, blocked retry, raw-evidence preservation, concise docs, and privacy-clean diff."
    cadence: "after each Worker package and at final audit"
    final_proof: "Unit/integration tests pass; CLI smoke checks pass; fake executor matrix passes; Codex/Claude config dry-runs are clean; privacy gate has no real secrets, private endpoints, local user paths, raw logs, session transcripts, or generated local config staged."
  intake:
    original_request: "Use the existing AGPair external-agent-first plan to start Codex execution."
    interpreted_outcome: "AGPair is refactored so Codex and Claude Code prefer external CLI agents first, wait cheaply, retry structured approval blocks, preserve raw evidence, and ship with clean docs/config/privacy gates."
    input_shape: existing_plan
    audience: "user and local Codex/Claude Code workflows"
    authority: requested
    proof_type: test
    completion_proof: "All required plan tasks have receipts, Task 14 verification passes, and final audit records full_outcome_complete: true."
    likely_misfire: "Only implementing the CLI happy path or docs while leaving, daemon, wait, hooks, legacy Gemini readability, config installers, fake executor matrix, or privacy gate stale."
    blind_spots_considered:
      - "Exact noninteractive flags for Antigravity CLI, Grok CLI, and Claude Code may require discovery."
      - "Local user config must not be committed and must be changed only through idempotent installer/dry-run paths."
      - "OMX source must remain untouched; adaptation lives in AGPair-owned hooks/skills/config."
      - "External executor output must remain untrusted until receipt, diff, and validation evidence are inspected."
    existing_plan_facts:
      - "Source plan: docs/superpowers/plans/2026-06-02-external-agent-first-agpair-v1.md"
      - "Canonical new executor ids: antigravity-cli, grok-cli, claude-code, codex."
      - "Gemini is rejected for new start/retry while historical gemini_cli records remain inspectable."
      - "Antigravity means Antigravity CLI for new routing, not IDE bridge or desktop app."
      - "Success terminal state is ready_for_review; commit_ref is optional unless required."
      - "V1 permission model is dispatch-time authorization profile plus structured blocked context plus retry --from-block."
      - "watch --json is low-noise state-change output with raw log paths, not full log streaming."
      - "Codex and Claude Code integrations use hooks/config/skills and fail open when AGPair is unavailable."
      - "Public docs stay concise/current-state and privacy gate runs before GitHub submission."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/external-agent-first-agpair-v1/"
    command: "npx goalbuddy board docs/goals/external-agent-first-agpair-v1"

